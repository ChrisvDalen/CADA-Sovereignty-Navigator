spring.application.name=cada-navigator-backend

# Lokale SQLite-database; het bestand wordt bij de eerste start aangemaakt.
spring.datasource.url=${DATABASE_URL:jdbc:sqlite:./cada.db?foreign_keys=on}
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.sql.init.mode=always

server.port=${PORT:8080}
