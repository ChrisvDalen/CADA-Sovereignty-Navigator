spring:
  application:
    name: cada-sovereignty-navigator
  datasource:
    url: jdbc:h2:file:./data/navigator;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

server:
  port: 8080

cada:
  cors:
    allowed-origins: http://localhost:4200
