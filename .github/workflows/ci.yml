name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (mvn verify)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Unit- en API-tests
        run: mvn -B verify

  frontend:
    name: Frontend (ng test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Dependencies installeren
        run: npm ci
      - name: Unit-tests (Vitest)
        run: npx ng test --watch=false
      - name: Productiebuild
        run: npm run build

  e2e:
    name: E2E-smoketest (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Backend-jar bouwen
        working-directory: backend
        run: mvn -B -DskipTests package
      - name: Dependencies installeren
        working-directory: frontend
        run: npm ci
      - name: Playwright-browser installeren
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Smoketest
        working-directory: frontend
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
