# Productiewaardige stack: PostgreSQL, de Spring Boot-backend (postgres-profiel)
# en de Angular-frontend achter nginx. De frontend proxyt /api naar de backend,
# dus de app is bereikbaar op http://localhost:8080.
#
# Starten:  docker compose up --build
# Stoppen:  docker compose down   (data blijft in het pg-data volume)

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: navigator
      POSTGRES_USER: navigator
      POSTGRES_PASSWORD: ${DB_PASSWORD:-navigator}
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U navigator -d navigator"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      DB_URL: jdbc:postgresql://db:5432/navigator
      DB_USERNAME: navigator
      DB_PASSWORD: ${DB_PASSWORD:-navigator}
      # De frontend serveert de app; hij is voor de browser hetzelfde origin.
      FRONTEND_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}
      CORS_ALLOWED_ORIGINS: ${PUBLIC_BASE_URL:-http://localhost:8080}
      # Zet op true wanneer u de aanmeldlink (nog) niet per mail bezorgt.
      AUTH_EXPOSE_LOGIN_LINK: ${AUTH_EXPOSE_LOGIN_LINK:-true}
      # Achter HTTPS op true zetten.
      AUTH_SECURE_COOKIES: ${AUTH_SECURE_COOKIES:-false}
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  pg-data:
